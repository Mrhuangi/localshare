<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalShare</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f7;
    --surface: rgba(255,255,255,0.72);
    --surface-hover: rgba(255,255,255,0.9);
    --border: rgba(0,0,0,0.08);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #aeaeb2;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-light: rgba(0,113,227,0.10);
    --green: #34c759;
    --red: #ff3b30;
    --orange: #ff9500;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);
    --radius: 18px;
    --radius-sm: 12px;
    --radius-xs: 8px;
    --font: -apple-system, 'SF Pro Display', 'SF Pro Text', BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --blur: blur(24px) saturate(180%);
  }

  html, body {
    height: 100%; font-family: var(--font);
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Background gradient orbs */
  body::before, body::after {
    content: '';
    position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: 0.35; pointer-events: none; z-index: 0;
  }
  body::before {
    width: 600px; height: 600px;
    background: radial-gradient(circle, #a8d8ff, #c8b4ff);
    top: -200px; right: -150px;
    animation: orb1 12s ease-in-out infinite alternate;
  }
  body::after {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #b9f0d0, #a8d8ff);
    bottom: -150px; left: -100px;
    animation: orb2 15s ease-in-out infinite alternate;
  }
  @keyframes orb1 { from { transform: translate(0,0) scale(1); } to { transform: translate(40px, 30px) scale(1.1); } }
  @keyframes orb2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px, -40px) scale(1.08); } }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; padding: 0;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px 16px;
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #0071e3, #34aadc);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,113,227,0.35);
  }
  .logo-icon svg { width: 18px; height: 18px; fill: white; }
  .logo-name { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-tagline { font-size: 13px; color: var(--text-secondary); }

  .header-right { display: flex; align-items: center; gap: 12px; }
  .my-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #34c759, #30d158);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(52,199,89,0.3);
    transition: transform 0.15s;
  }
  .my-avatar:hover { transform: scale(1.08); }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 999px;
    font-size: 13px; color: var(--text-secondary);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-tertiary);
    transition: background 0.4s;
  }
  .status-dot.connected { background: var(--green); box-shadow: 0 0 6px rgba(52,199,89,0.6); }
  .status-dot.connecting { background: var(--orange); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── Main layout ── */
  main {
    flex: 1; display: grid;
    grid-template-columns: 300px 1fr;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  sidebar {
    display: flex; flex-direction: column;
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .sidebar-header {
    padding: 18px 20px 12px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-secondary);
  }
  .peer-list {
    flex: 1; overflow-y: auto; padding: 0 12px 12px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }

  .peer-card {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px; border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.15s ease;
    border: 1px solid transparent; margin-bottom: 4px;
    position: relative;
  }
  .peer-card:hover { background: var(--surface-hover); border-color: var(--border); }
  .peer-card.selected {
    background: var(--accent-light);
    border-color: rgba(0,113,227,0.2);
  }
  .peer-card.selected .peer-name { color: var(--accent); }

  .peer-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, #ececf1, #d8d8df);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0; position: relative;
  }
  .peer-online-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green); border: 1.5px solid white;
  }
  .peer-info { flex: 1; min-width: 0; }
  .peer-name { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .peer-device { font-size: 12px; color: var(--text-secondary); }

  .empty-peers {
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px; text-align: center; gap: 10px;
  }
  .empty-peers .icon { font-size: 36px; opacity: 0.3; }
  .empty-peers p { font-size: 13px; color: var(--text-tertiary); line-height: 1.5; }

  /* ── Center panel ── */
  .center {
    display: flex; flex-direction: column;
    overflow: hidden;
    padding: 24px;
    gap: 20px;
  }

  /* Drop zone */
  .drop-zone {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    background: rgba(255,255,255,0.5);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    transition: all 0.2s ease;
    cursor: pointer; position: relative; overflow: hidden;
    gap: 16px;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-light);
    box-shadow: 0 0 0 4px rgba(0,113,227,0.08);
  }
  .drop-zone.drag-over .drop-icon { transform: scale(1.1) translateY(-4px); }

  .drop-icon {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, #0071e3, #34aadc);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(0,113,227,0.28);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .drop-icon svg { width: 34px; height: 34px; fill: white; }

  .drop-title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .drop-subtitle { font-size: 14px; color: var(--text-secondary); }
  .drop-hint { font-size: 13px; color: var(--text-tertiary); }

  .select-file-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: white;
    border: none; padding: 9px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: var(--font);
    transition: all 0.15s; box-shadow: 0 2px 8px rgba(0,113,227,0.3);
  }
  .select-file-btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,113,227,0.4); }
  .select-file-btn:active { transform: translateY(0); }

  /* Transfers panel */
  .transfers-panel {
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    max-height: 240px;
    display: flex; flex-direction: column;
    transition: max-height 0.3s ease;
  }
  .transfers-panel.empty { max-height: 0; border: none; }

  .transfers-header {
    padding: 14px 18px 10px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--text-secondary); border-bottom: 1px solid var(--border);
  }
  .transfers-list { overflow-y: auto; padding: 8px 12px; }

  .transfer-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 8px; border-radius: var(--radius-xs);
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .transfer-file-icon {
    width: 36px; height: 36px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    background: rgba(0,0,0,0.04);
  }
  .transfer-info { flex: 1; min-width: 0; }
  .transfer-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .transfer-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .transfer-progress-bar {
    height: 3px; background: var(--border); border-radius: 2px;
    margin-top: 5px; overflow: hidden;
  }
  .transfer-progress-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), #34aadc);
    transition: width 0.15s ease;
  }
  .transfer-status {
    font-size: 12px; font-weight: 500; flex-shrink: 0;
    color: var(--text-secondary);
  }
  .transfer-status.done { color: var(--green); }
  .transfer-status.error { color: var(--red); }

  /* ── Toast ── */
  #toast-container {
    position: fixed; bottom: 24px; right: 24px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 9999;
  }
  .toast {
    display: flex; align-items: center; gap: 10px;
    background: rgba(28,28,30,0.88);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    color: white; padding: 12px 16px; border-radius: var(--radius-sm);
    font-size: 14px; box-shadow: var(--shadow-lg);
    animation: toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 320px;
  }
  @keyframes toastIn { from { opacity:0; transform: translateX(40px) scale(0.9); } to { opacity:1; transform: translateX(0) scale(1); } }
  .toast.exit { animation: toastOut 0.2s ease forwards; }
  @keyframes toastOut { to { opacity:0; transform: translateX(40px) scale(0.9); } }
  .toast-icon { font-size: 18px; flex-shrink: 0; }

  /* ── Incoming modal ── */
  #incoming-modal {
    position: fixed; inset: 0; z-index: 9998;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  #incoming-modal.show { opacity: 1; pointer-events: all; }
  .modal-card {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border-radius: 22px;
    padding: 32px 28px 24px;
    width: 340px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18), 0 0 0 1px var(--border);
    transform: scale(0.92);
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  #incoming-modal.show .modal-card { transform: scale(1); }
  .modal-file-icon { font-size: 52px; margin-bottom: 12px; }
  .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .modal-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 11px; border-radius: 999px; border: none;
    font-size: 15px; font-weight: 500; cursor: pointer;
    font-family: var(--font); transition: all 0.15s;
  }
  .btn-secondary { background: rgba(0,0,0,0.07); color: var(--text); }
  .btn-secondary:hover { background: rgba(0,0,0,0.11); }
  .btn-primary { background: var(--accent); color: white; box-shadow: 0 2px 8px rgba(0,113,227,0.3); }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,113,227,0.4); }

  /* ── Setup screen ── */
  #setup-screen {
    position: fixed; inset: 0; z-index: 9997;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    transition: opacity 0.4s;
  }
  #setup-screen.hidden { opacity: 0; pointer-events: none; }
  .setup-card {
    background: var(--surface);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--border);
    border-radius: 24px; padding: 40px 36px;
    width: 360px; text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .setup-logo { font-size: 56px; margin-bottom: 16px; }
  .setup-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
  .setup-sub { font-size: 15px; color: var(--text-secondary); margin-bottom: 28px; }
  .emoji-picker {
    display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .emoji-opt {
    width: 48px; height: 48px; border-radius: 14px; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 2px solid transparent; transition: all 0.15s;
    background: rgba(0,0,0,0.04);
  }
  .emoji-opt:hover { transform: scale(1.1); background: var(--accent-light); border-color: rgba(0,113,227,0.3); }
  .emoji-opt.selected { border-color: var(--accent); background: var(--accent-light); }
  .setup-input {
    width: 100%; padding: 12px 16px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.8); font-size: 15px;
    font-family: var(--font); color: var(--text);
    outline: none; transition: border-color 0.15s; margin-bottom: 16px;
  }
  .setup-input:focus { border-color: var(--accent); }
  .setup-btn {
    width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--accent); color: white;
    font-size: 16px; font-weight: 600; cursor: pointer;
    font-family: var(--font); transition: all 0.15s;
    box-shadow: 0 4px 14px rgba(0,113,227,0.35);
  }
  .setup-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }

  /* No peer selected hint */
  .no-peer-hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none;
  }
  .no-peer-hint .hint-icon { font-size: 48px; opacity: 0.18; margin-bottom: 10px; }
  .no-peer-hint p { font-size: 15px; color: var(--text-tertiary); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- Setup Screen -->
<div id="setup-screen">
  <div class="setup-card">
    <div class="setup-logo">📡</div>
    <div class="setup-title">LocalShare</div>
    <div class="setup-sub">同一 Wi-Fi，即刻传送</div>
    <div class="emoji-picker" id="emoji-picker">
      <div class="emoji-opt selected" data-emoji="💻">💻</div>
      <div class="emoji-opt" data-emoji="📱">📱</div>
      <div class="emoji-opt" data-emoji="🖥️">🖥️</div>
      <div class="emoji-opt" data-emoji="🎧">🎧</div>
      <div class="emoji-opt" data-emoji="⌚">⌚</div>
      <div class="emoji-opt" data-emoji="🎮">🎮</div>
    </div>
    <input class="setup-input" id="device-name-input" placeholder="给你的设备起个名字" maxlength="24">
    <button class="setup-btn" id="join-btn">进入局域网 →</button>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.3L20 8.5v7L12 19.7 4 15.5v-7L12 4.3z"/></svg>
      </div>
      <div>
        <div class="logo-name">LocalShare</div>
        <div class="logo-tagline">局域网文件传送</div>
      </div>
    </div>
    <div class="header-right">
      <div class="status-pill">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">连接中…</span>
      </div>
      <div class="my-avatar" id="my-avatar-display" title="我的设备">💻</div>
    </div>
  </header>

  <main>
    <sidebar>
      <div class="sidebar-header">附近设备</div>
      <div class="peer-list" id="peer-list">
        <div class="empty-peers">
          <div class="icon">📡</div>
          <p>等待其他设备上线…<br>请确保在同一 Wi-Fi 下</p>
        </div>
      </div>
    </sidebar>

    <div class="center">
      <div class="drop-zone" id="drop-zone">
        <div class="no-peer-hint" id="no-peer-hint">
          <div class="hint-icon">👈</div>
          <p>先从左侧选择<br>要发送到的设备</p>
        </div>
        <div id="drop-zone-content" style="display:none; flex-direction:column; align-items:center; gap:16px;">
          <div class="drop-icon">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          </div>
          <div>
            <div class="drop-title">拖放文件到这里</div>
            <div class="drop-subtitle" id="send-to-label">发送给…</div>
          </div>
          <div class="drop-hint">支持任意格式，大小不限</div>
          <button class="select-file-btn" id="select-file-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M19 13H13v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            选择文件
          </button>
        </div>
        <input type="file" id="file-input" style="display:none" multiple>
      </div>

      <div class="transfers-panel empty" id="transfers-panel">
        <div class="transfers-header">传输记录</div>
        <div class="transfers-list" id="transfers-list"></div>
      </div>
    </div>
  </main>
</div>

<!-- Incoming Request Modal -->
<div id="incoming-modal">
  <div class="modal-card">
    <div class="modal-file-icon" id="modal-file-icon">📄</div>
    <div class="modal-title" id="modal-title">收到文件请求</div>
    <div class="modal-sub" id="modal-sub">来自 unknown</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="reject-btn">拒绝</button>
      <button class="btn btn-primary" id="accept-btn">接受</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<script>
const EMOJIS = ['💻','📱','🖥️','🎧','⌚','🎮'];
let selectedEmoji = '💻';
let myId = null, myName = '', myAvatar = '💻';
let selectedPeerId = null;
let ws = null;
let peers = [];
let pendingTransfer = null;
let transfers = {};

// ── Setup ──
document.querySelectorAll('.emoji-opt').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.emoji-opt').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
    selectedEmoji = el.dataset.emoji;
  });
});

// Auto-fill device name
fetch('/api/info').then(r=>r.json()).then(info => {
  document.getElementById('device-name-input').placeholder = info.hostname || '我的设备';
});

document.getElementById('join-btn').addEventListener('click', joinNetwork);
document.getElementById('device-name-input').addEventListener('keydown', e => { if(e.key==='Enter') joinNetwork(); });

function joinNetwork() {
  const inputVal = document.getElementById('device-name-input').value.trim();
  myName = inputVal || document.getElementById('device-name-input').placeholder || '我的设备';
  myAvatar = selectedEmoji;
  document.getElementById('my-avatar-display').textContent = myAvatar;
  document.getElementById('setup-screen').classList.add('hidden');
  connectWS();
}

// ── WebSocket ──
function connectWS() {
  setStatus('connecting');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'register', name: myName, avatar: myAvatar, deviceType: 'desktop' }));
  };

  ws.onmessage = (e) => {
    if (e.data instanceof Blob) { handleBinaryMessage(e.data); return; }
    const msg = JSON.parse(e.data);
    switch(msg.type) {
      case 'welcome': myId = msg.id; setStatus('connected'); break;
      case 'peers': updatePeers(msg.peers); break;
      case 'transfer-request': showIncomingRequest(msg); break;
      case 'transfer-accept': onTransferAccepted(msg); break;
      case 'transfer-reject': onTransferRejected(msg); break;
      case 'transfer-complete': onTransferComplete(msg); break;
    }
  };

  ws.onclose = () => {
    setStatus('disconnected');
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
}

async function handleBinaryMessage(blob) {
  const buf = await blob.arrayBuffer();
  const view = new DataView(buf);
  const headerLen = view.getUint32(0);
  const headerBytes = new Uint8Array(buf, 4, headerLen);
  const header = JSON.parse(new TextDecoder().decode(headerBytes));
  const fileData = new Uint8Array(buf, 4 + headerLen);

  // Save file
  const fileBlob = new Blob([fileData], { type: header.fileType || 'application/octet-stream' });
  const url = URL.createObjectURL(fileBlob);
  const a = document.createElement('a');
  a.href = url; a.download = header.fileName; a.click();
  URL.revokeObjectURL(url);

  updateTransfer(header.transferId, { status: 'done', progress: 100 });
  // Notify sender
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'transfer-complete', targetId: header.senderId, transferId: header.transferId }));
  }
  showToast('✅', `已接收 ${header.fileName}`);
}

// ── Status ──
function setStatus(s) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  dot.className = 'status-dot ' + s;
  txt.textContent = s==='connected' ? '已连接' : s==='connecting' ? '连接中…' : '已断线';
}

// ── Peers ──
function updatePeers(newPeers) {
  peers = newPeers.filter(p => p.id !== myId);
  const list = document.getElementById('peer-list');
  if (peers.length === 0) {
    list.innerHTML = `<div class="empty-peers"><div class="icon">📡</div><p>等待其他设备上线…<br>请确保在同一 Wi-Fi 下</p></div>`;
    return;
  }
  list.innerHTML = peers.map(p => `
    <div class="peer-card ${p.id===selectedPeerId?'selected':''}" data-id="${p.id}">
      <div class="peer-avatar">${p.avatar}<div class="peer-online-dot"></div></div>
      <div class="peer-info">
        <div class="peer-name">${p.name}</div>
        <div class="peer-device">在线</div>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.peer-card').forEach(card => {
    card.addEventListener('click', () => selectPeer(card.dataset.id));
  });
}

function selectPeer(id) {
  selectedPeerId = id;
  const peer = peers.find(p => p.id === id);
  updatePeers(peers);
  document.getElementById('no-peer-hint').style.display = 'none';
  const content = document.getElementById('drop-zone-content');
  content.style.display = 'flex';
  if(peer) document.getElementById('send-to-label').textContent = `发送给 ${peer.avatar} ${peer.name}`;
}

// ── File handling ──
const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (!selectedPeerId) { showToast('⚠️', '请先选择目标设备'); return; }
  [...e.dataTransfer.files].forEach(sendFile);
});

document.getElementById('select-file-btn').addEventListener('click', e => {
  e.stopPropagation();
  if (!selectedPeerId) { showToast('⚠️', '请先选择目标设备'); return; }
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', e => {
  [...e.target.files].forEach(sendFile);
  e.target.value = '';
});

async function sendFile(file) {
  if (!selectedPeerId || !ws) return;
  const transferId = Math.random().toString(36).slice(2);

  addTransfer(transferId, { name: file.name, size: file.size, direction: 'out', status: 'waiting', progress: 0 });

  // Request transfer
  ws.send(JSON.stringify({
    type: 'transfer-request',
    targetId: selectedPeerId,
    fileName: file.name,
    fileSize: file.size,
    fileType: file.type,
    transferId
  }));

  // Store file reference for when accepted
  transfers[transferId]._file = file;
  transfers[transferId]._targetId = selectedPeerId;
}

async function doSendFile(transferId) {
  const t = transfers[transferId];
  if (!t || !t._file) return;
  const file = t._file;

  updateTransfer(transferId, { status: 'sending', progress: 0 });

  const reader = new FileReader();
  reader.onload = async () => {
    const fileData = new Uint8Array(reader.result);
    const header = JSON.stringify({
      targetId: t._targetId, fileName: file.name,
      fileSize: file.size, fileType: file.type, transferId
    });
    const headerBuf = new TextEncoder().encode(header);
    const lenBuf = new ArrayBuffer(4);
    new DataView(lenBuf).setUint32(0, headerBuf.length);
    const out = new Uint8Array(4 + headerBuf.length + fileData.length);
    out.set(new Uint8Array(lenBuf), 0);
    out.set(headerBuf, 4);
    out.set(fileData, 4 + headerBuf.length);
    ws.send(out.buffer);
    updateTransfer(transferId, { status: 'sending', progress: 80 });
  };
  reader.readAsArrayBuffer(file);
}

// ── Incoming ──
function showIncomingRequest(msg) {
  pendingTransfer = msg;
  document.getElementById('modal-file-icon').textContent = getFileEmoji(msg.fileName);
  document.getElementById('modal-title').textContent = msg.fileName;
  document.getElementById('modal-sub').textContent = `来自 ${msg.senderName} · ${formatSize(msg.fileSize)}`;
  document.getElementById('incoming-modal').classList.add('show');
  addTransfer(msg.transferId, { name: msg.fileName, size: msg.fileSize, direction: 'in', status: 'waiting', progress: 0 });
}

document.getElementById('accept-btn').addEventListener('click', () => {
  if(!pendingTransfer) return;
  ws.send(JSON.stringify({ type: 'transfer-accept', targetId: pendingTransfer.senderId, transferId: pendingTransfer.transferId }));
  updateTransfer(pendingTransfer.transferId, { status: 'receiving' });
  document.getElementById('incoming-modal').classList.remove('show');
  pendingTransfer = null;
});

document.getElementById('reject-btn').addEventListener('click', () => {
  if(!pendingTransfer) return;
  ws.send(JSON.stringify({ type: 'transfer-reject', targetId: pendingTransfer.senderId, transferId: pendingTransfer.transferId }));
  updateTransfer(pendingTransfer.transferId, { status: 'rejected' });
  document.getElementById('incoming-modal').classList.remove('show');
  pendingTransfer = null;
});

function onTransferAccepted(msg) {
  updateTransfer(msg.transferId, { status: 'sending' });
  doSendFile(msg.transferId);
}

function onTransferRejected(msg) {
  updateTransfer(msg.transferId, { status: 'rejected' });
  showToast('❌', '对方拒绝了接收');
}

function onTransferComplete(msg) {
  updateTransfer(msg.transferId, { status: 'done', progress: 100 });
  showToast('✅', '文件发送成功！');
}

// ── Transfers UI ──
function addTransfer(id, info) {
  transfers[id] = { ...info };
  renderTransfers();
}

function updateTransfer(id, info) {
  if (transfers[id]) {
    Object.assign(transfers[id], info);
    renderTransfers();
  }
}

function renderTransfers() {
  const panel = document.getElementById('transfers-panel');
  const list = document.getElementById('transfers-list');
  const ids = Object.keys(transfers);
  if (ids.length === 0) { panel.classList.add('empty'); return; }
  panel.classList.remove('empty');

  list.innerHTML = ids.map(id => {
    const t = transfers[id];
    const statusLabels = { waiting:'等待确认', sending:'发送中', receiving:'接收中', done:'完成', rejected:'已拒绝', error:'错误' };
    const statusClass = t.status === 'done' ? 'done' : t.status === 'error' || t.status === 'rejected' ? 'error' : '';
    const arrow = t.direction === 'out' ? '↑' : '↓';
    return `
      <div class="transfer-item">
        <div class="transfer-file-icon">${getFileEmoji(t.name)}</div>
        <div class="transfer-info">
          <div class="transfer-name">${arrow} ${t.name}</div>
          <div class="transfer-meta">${formatSize(t.size)}</div>
          ${t.status==='sending'||t.status==='receiving' ? `
            <div class="transfer-progress-bar">
              <div class="transfer-progress-fill" style="width:${t.progress||30}%"></div>
            </div>` : ''}
        </div>
        <div class="transfer-status ${statusClass}">${statusLabels[t.status]||t.status}</div>
      </div>`;
  }).join('');
}

// ── Utils ──
function getFileEmoji(name) {
  const ext = (name||'').split('.').pop().toLowerCase();
  const map = { jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️', webp:'🖼️', svg:'🖼️',
    mp4:'🎬', mov:'🎬', avi:'🎬', mkv:'🎬', pdf:'📄', doc:'📝', docx:'📝',
    xls:'📊', xlsx:'📊', ppt:'📊', zip:'🗜️', rar:'🗜️', mp3:'🎵', wav:'🎵',
    aac:'🎵', txt:'📋', js:'⌨️', ts:'⌨️', py:'⌨️', html:'⌨️', css:'⌨️' };
  return map[ext] || '📦';
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024**3) return (bytes/1024/1024).toFixed(1) + ' MB';
  return (bytes/1024/1024/1024).toFixed(1) + ' GB';
}

function showToast(icon, text) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="toast-icon">${icon}</span><span>${text}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.classList.add('exit');
    setTimeout(() => el.remove(), 300);
  }, 3500);
}
</script>
